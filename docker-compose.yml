version: '3.8'

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: n8n-ai-video-renderer
    restart: unless-stopped
    ports:
      - "${N8N_PORT}:5678"
    environment:
      # n8n Configuration
      - N8N_HOST=${N8N_HOST}
      - N8N_PORT=5678
      - N8N_PROTOCOL=${N8N_PROTOCOL}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${TZ}
      
      # Database Configuration
      - DB_TYPE=${DB_TYPE}
      - DB_SQLITE_DATABASE=${DB_SQLITE_DATABASE}
      
      # Security Settings
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE}
      - N8N_LOG_LEVEL=${N8N_LOG_LEVEL}
      - N8N_USER_MANAGEMENT_JWT_SECRET=${N8N_USER_MANAGEMENT_JWT_SECRET}
      - N8N_USER_MANAGEMENT_DISABLED=${N8N_USER_MANAGEMENT_DISABLED}
      - N8N_DIAGNOSTICS_ENABLED=${N8N_DIAGNOSTICS_ENABLED}
      - N8N_VERSION_NOTIFICATIONS_ENABLED=${N8N_VERSION_NOTIFICATIONS_ENABLED}
      - N8N_TEMPLATES_ENABLED=${N8N_TEMPLATES_ENABLED}
      - N8N_ONBOARDING_FLOW_DISABLED=${N8N_ONBOARDING_FLOW_DISABLED}
      - N8N_METRICS=${N8N_METRICS}
      - N8N_SECURE_COOKIE=${N8N_SECURE_COOKIE}
      
      # YouTube API Configuration
      - YOUTUBE_CLIENT_ID=${YOUTUBE_CLIENT_ID}
      - YOUTUBE_CLIENT_SECRET=${YOUTUBE_CLIENT_SECRET}
      - YOUTUBE_REFRESH_TOKEN=${YOUTUBE_REFRESH_TOKEN}
      - YOUTUBE_ACCESS_TOKEN=${YOUTUBE_ACCESS_TOKEN}
      - YOUTUBE_CHANNEL_ID=${YOUTUBE_CHANNEL_ID}
      - YOUTUBE_DEFAULT_PRIVACY=${YOUTUBE_DEFAULT_PRIVACY}
      - YOUTUBE_DEFAULT_CATEGORY=${YOUTUBE_DEFAULT_CATEGORY}
      
      # AI Services
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_AI_STUDIO_KEY=${GOOGLE_AI_STUDIO_KEY}
      - HF_TOKEN=${HF_TOKEN}
      - JSON2VIDEO_KEY=${JSON2VIDEO_KEY}
      - ELEVENLABS_KEY=${ELEVENLABS_KEY}
      
      # Media Services
      - PEXELS_KEY=${PEXELS_KEY}
      - PIXABAY_KEY=${PIXABAY_KEY}
      
      # URL Shortening & Reddit
      - BITLY_TOKEN=${BITLY_TOKEN}
      - REDDIT_CLIENT_ID=${REDDIT_CLIENT_ID}
      - REDDIT_SECRET=${REDDIT_SECRET}
      
      # Notification Services
      - DISCORD_WEBHOOK_URL=${DISCORD_WEBHOOK_URL}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      
      # Google Cloud Configuration
      - GOOGLE_PROJECT_ID=${GOOGLE_PROJECT_ID}
      - GOOGLE_APPLICATION_CREDENTIALS=${GOOGLE_APPLICATION_CREDENTIALS}
      
      # System Control
      - INPUT_SANITIZATION=${INPUT_SANITIZATION}
      - SECURE_DELETE_PASSES=${SECURE_DELETE_PASSES}
      - MAX_MEMORY_MB=${MAX_MEMORY_MB}
      - MAX_CONCURRENT_RENDERS=${MAX_CONCURRENT_RENDERS}
      - RATE_LIMIT_RPM=${RATE_LIMIT_RPM}
      - MONITORING_ENABLED=${MONITORING_ENABLED}
      - LOG_LEVEL=${LOG_LEVEL}
      
      # Paths
      - RENDER_SCRIPT_DIR=${RENDER_SCRIPT_DIR}
      - RENDER_OUTPUT_DIR=${RENDER_OUTPUT_DIR}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./service-account-key.json:/app/service-account-key.json:ro
      - ./n8n-workflows:/app/workflows:ro
      - ./scripts:/app/scripts:ro
    env_file:
      - .env.n8n
    networks:
      - n8n_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:5678/healthz || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  n8n_data:
    driver: local

networks:
  n8n_network:
    driver: bridge